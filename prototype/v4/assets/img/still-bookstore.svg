<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1016"/>
      <stop offset="0.55" stop-color="#141a20"/>
      <stop offset="1" stop-color="#241d19"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.52" r="0.42">
      <stop offset="0" stop-color="#ffb36b" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#d9713a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#d9713a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffcf8d"/>
      <stop offset="0.6" stop-color="#f0954e"/>
      <stop offset="1" stop-color="#c4602c"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2027"/>
      <stop offset="1" stop-color="#090b0e"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#sky)"/>
  <rect width="900" height="1600" fill="url(#glow)"/>

  <!-- 远处建筑 -->
  <g fill="#12161c">
    <rect x="0" y="300" width="170" height="700"/>
    <rect x="740" y="250" width="160" height="760"/>
    <rect x="120" y="390" width="90" height="640" fill="#0f1318"/>
  </g>
  <g fill="#2a2f36" opacity="0.5">
    <rect x="24" y="340" width="110" height="6"/>
    <rect x="24" y="420" width="110" height="6"/>
    <rect x="768" y="300" width="100" height="5"/>
  </g>

  <!-- 书店立面 -->
  <rect x="170" y="360" width="600" height="700" fill="#1a1714"/>
  <rect x="170" y="360" width="600" height="14" fill="#2a2420"/>
  <rect x="200" y="400" width="540" height="330" fill="#0f0d0c"/>
  <!-- 窗光 -->
  <rect x="212" y="412" width="516" height="306" rx="4" fill="url(#window)" opacity="0.95"/>
  <rect x="212" y="412" width="516" height="306" rx="4" fill="url(#glow)" opacity="0.5"/>
  <!-- 窗框与书架 -->
  <g stroke="#241a13" stroke-width="9" opacity="0.85">
    <line x1="382" y1="412" x2="382" y2="718"/>
    <line x1="548" y1="412" x2="548" y2="718"/>
    <line x1="212" y1="560" x2="728" y2="560"/>
  </g>
  <g fill="#8c4a25" opacity="0.55">
    <rect x="228" y="470" width="140" height="10"/><rect x="228" y="500" width="140" height="10"/>
    <rect x="228" y="530" width="140" height="10"/>
    <rect x="400" y="470" width="130" height="10"/><rect x="400" y="500" width="130" height="10"/>
    <rect x="566" y="470" width="140" height="10"/><rect x="566" y="500" width="140" height="10"/>
    <rect x="566" y="530" width="140" height="10"/>
  </g>
  <!-- 窗内剪影：书店老板 -->
  <g fill="#3a2116" opacity="0.9">
    <circle cx="470" cy="600" r="30"/>
    <path d="M410 720 q60 -110 120 0 z"/>
  </g>
  <!-- 门与招牌 -->
  <rect x="200" y="770" width="540" height="200" fill="#16120f"/>
  <rect x="545" y="790" width="150" height="180" fill="#2b1d13"/>
  <rect x="552" y="798" width="136" height="172" fill="#7a3f1e" opacity="0.55"/>
  <rect x="250" y="800" width="250" height="58" rx="3" fill="#2a1c12" stroke="#513521" stroke-width="2"/>
  <text x="375" y="838" text-anchor="middle" font-family="Georgia, 'Songti SC', serif" font-size="26" fill="#e7c79a" letter-spacing="6">长夜书店</text>
  <rect x="250" y="862" width="120" height="4" fill="#3d2a1a"/>

  <!-- 雨 -->
  <g stroke="#cfe0ea" stroke-width="1.2" opacity="0.35">
    <line x1="60" y1="120" x2="30" y2="260"/><line x1="240" y1="40" x2="210" y2="190"/>
    <line x1="430" y1="90" x2="400" y2="240"/><line x1="640" y1="60" x2="610" y2="210"/>
    <line x1="840" y1="140" x2="810" y2="290"/><line x1="760" y1="380" x2="730" y2="530"/>
    <line x1="120" y1="340" x2="90" y2="490"/><line x1="330" y1="300" x2="300" y2="450"/>
    <line x1="680" y1="260" x2="650" y2="410"/><line x1="820" y1="560" x2="790" y2="710"/>
    <line x1="40" y1="700" x2="10" y2="850"/><line x1="900" y1="880" x2="870" y2="1030"/>
  </g>

  <!-- 地面与倒影 -->
  <rect x="0" y="970" width="900" height="630" fill="url(#ground)"/>
  <g opacity="0.45" filter="url(#soft)">
    <rect x="240" y="980" width="460" height="260" fill="#d97a3a" opacity="0.28"/>
    <rect x="300" y="1000" width="120" height="320" fill="#e8a05c" opacity="0.18"/>
  </g>
  <g stroke="#7f8b93" stroke-width="1" opacity="0.2">
    <line x1="100" y1="1080" x2="420" y2="1080"/>
    <line x1="520" y1="1140" x2="880" y2="1140"/>
    <line x1="200" y1="1220" x2="640" y2="1220"/>
  </g>

  <!-- 前景人物：撑伞的人 -->
  <g fill="#0a0b0e">
    <path d="M690 1600 L690 1270 q-6 -70 34 -70 q40 0 34 70 L768 1600 z"/>
    <circle cx="724" cy="1180" r="24"/>
    <path d="M600 1180 q124 -150 250 0 q-20 -20 -40 0 q-80 30 -170 0 z" fill="#101217"/>
    <line x1="724" y1="1230" x2="724" y2="1170" stroke="#0a0b0e" stroke-width="4"/>
  </g>
  <rect width="900" height="1600" fill="#000" opacity="0.1" filter="url(#grain)"/>
</svg>
