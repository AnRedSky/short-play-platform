<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20241f"/>
      <stop offset="1" stop-color="#0d0f0d"/>
    </linearGradient>
    <radialGradient id="cone" cx="0.5" cy="0.3" r="0.55">
      <stop offset="0" stop-color="#ffd28d" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#c79a55" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c79a55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a28"/>
      <stop offset="1" stop-color="#2a2117"/>
    </linearGradient>
    <filter id="b2"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#wall)"/>

  <!-- 百叶窗 -->
  <rect x="60" y="120" width="300" height="480" fill="#0a0d0c"/>
  <g fill="#4d5b52" opacity="0.22">
    <rect x="72" y="140" width="276" height="8"/><rect x="72" y="172" width="276" height="8"/>
    <rect x="72" y="204" width="276" height="8"/><rect x="72" y="236" width="276" height="8"/>
    <rect x="72" y="268" width="276" height="8"/><rect x="72" y="300" width="276" height="8"/>
    <rect x="72" y="332" width="276" height="8"/><rect x="72" y="364" width="276" height="8"/>
    <rect x="72" y="396" width="276" height="8"/><rect x="72" y="428" width="276" height="8"/>
    <rect x="72" y="460" width="276" height="8"/><rect x="72" y="492" width="276" height="8"/>
    <rect x="72" y="524" width="276" height="8"/><rect x="72" y="556" width="276" height="8"/>
  </g>

  <!-- 墙面纹理 -->
  <g stroke="#2c312b" stroke-width="1" opacity="0.35">
    <line x1="520" y1="0" x2="520" y2="900"/><line x1="640" y1="0" x2="640" y2="900"/>
    <line x1="0" y1="760" x2="900" y2="760"/>
  </g>

  <!-- 吊灯 -->
  <line x1="620" y1="0" x2="620" y2="260" stroke="#2b2e29" stroke-width="3"/>
  <path d="M580 260 h80 l16 54 h-112 z" fill="#3a4038"/>
  <ellipse cx="620" cy="318" rx="26" ry="10" fill="#ffe0a3" filter="url(#b2)"/>
  <path d="M560 330 L680 330 L780 1600 L440 1600 Z" fill="url(#cone)"/>

  <!-- 桌子 -->
  <rect x="120" y="820" width="660" height="34" rx="3" fill="url(#desk)"/>
  <rect x="150" y="854" width="26" height="340" fill="#241c13"/>
  <rect x="720" y="854" width="26" height="340" fill="#241c13"/>
  <rect x="120" y="1160" width="660" height="14" fill="#1c1610"/>

  <!-- 桌上物证 -->
  <rect x="300" y="780" width="150" height="42" fill="#d9cbb2"/>
  <rect x="310" y="768" width="130" height="14" fill="#eee2cb"/>
  <line x1="300" y1="800" x2="450" y2="800" stroke="#b7a589" stroke-width="1"/>
  <circle cx="540" cy="780" r="26" fill="#c9b58f"/>
  <rect x="516" y="760" width="48" height="16" rx="8" fill="#b09a75"/>
  <rect x="620" y="770" width="70" height="54" fill="#6d6a5d"/>
  <rect x="628" y="778" width="54" height="8" fill="#8d8a7c"/>

  <!-- 椅子与人物 -->
  <g fill="#070907">
    <path d="M180 1600 L180 1010 q0 -80 60 -80 q60 0 60 80 L300 1600 Z"/>
    <circle cx="240" cy="880" r="40"/>
  </g>
  <!-- 对面审讯者 -->
  <g fill="#0a0c0a" opacity="0.95">
    <path d="M640 1600 L640 1080 q0 -70 54 -70 q54 0 54 70 L748 1600 Z"/>
    <circle cx="694" cy="960" r="34"/>
  </g>

  <!-- 烟雾 -->
  <path d="M700 900 q40 -80 6 -150 q50 20 30 100 q18 40 -6 70" stroke="#b7b3a4" stroke-width="3" fill="none" opacity="0.16"/>

  <rect width="900" height="1600" fill="#000" opacity="0.16"/>
</svg>
