<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#0c1417"/>
      <stop offset="1" stop-color="#060a0c"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.28" r="0.4">
      <stop offset="0" stop-color="#ffcf8a" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#e79a45" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#e79a45" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a2b"/>
      <stop offset="1" stop-color="#050808"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#night)"/>

  <!-- 两侧墙体 -->
  <path d="M0 0 L0 1600 L300 1600 L360 420 L250 0 Z" fill="#10181a"/>
  <path d="M900 0 L900 1600 L640 1600 L570 430 L690 0 Z" fill="#0b1214"/>
  <path d="M300 1600 L640 1600 L570 430 L360 420 Z" fill="#141d1f"/>

  <!-- 砖缝 -->
  <g stroke="#1c2729" stroke-width="2" opacity="0.8">
    <path d="M300 1600 L640 1600"/>
    <path d="M320 1400 L620 1400"/><path d="M335 1200 L600 1200"/>
    <path d="M345 1000 L585 1000"/><path d="M352 800 L575 800"/>
    <path d="M356 620 L568 620"/><path d="M360 470 L566 470"/>
  </g>

  <!-- 远处出口 -->
  <rect x="360" y="420" width="210" height="260" fill="#27383a"/>
  <rect x="360" y="420" width="210" height="260" fill="url(#lamp)" opacity="0.4"/>

  <!-- 挂灯 -->
  <line x1="450" y1="300" x2="450" y2="420" stroke="#2a2f31" stroke-width="3"/>
  <circle cx="450" cy="440" r="34" fill="#ffd79a" filter="url(#blur)" opacity="0.7"/>
  <path d="M418 444 h64 l-8 40 h-48 z" fill="#e8b168"/>
  <circle cx="450" cy="428" r="3" fill="#fff3d4"/>

  <!-- 光锥 -->
  <path d="M418 484 L482 484 L560 1600 L330 1600 Z" fill="#e9a858" opacity="0.06"/>

  <!-- 地面 -->
  <rect x="0" y="680" width="900" height="920" fill="url(#wet)"/>
  <g opacity="0.4" filter="url(#blur)">
    <rect x="380" y="700" width="170" height="500" fill="#d89446" opacity="0.35"/>
    <rect x="320" y="720" width="40" height="700" fill="#5e8a83" opacity="0.2"/>
  </g>
  <g stroke="#6e8a86" stroke-width="1" opacity="0.25">
    <path d="M60 900 q120 30 240 0"/><path d="M520 1000 q110 24 220 0"/><path d="M180 1180 q140 20 280 0"/>
  </g>

  <!-- 侧门与暖光 -->
  <rect x="60" y="640" width="150" height="240" fill="#221a12"/>
  <rect x="72" y="652" width="126" height="228" fill="#8a5227" opacity="0.35"/>
  <rect x="700" y="700" width="120" height="200" fill="#141c1b"/>
  <rect x="706" y="706" width="108" height="194" fill="#3b5b52" opacity="0.18"/>

  <!-- 人物剪影 -->
  <g fill="#06090a">
    <path d="M470 1600 L470 1290 q-2 -60 28 -62 q30 12 28 62 L532 1600 Z"/>
    <circle cx="500" cy="1200" r="22"/>
    <path d="M470 1240 q30 -12 60 0 l8 40 l-76 0 z"/>
  </g>
  <!-- 烟 -->
  <path d="M505 1190 q20 -60 -2 -100 q30 10 18 60" stroke="#8fa09c" stroke-width="2" fill="none" opacity="0.22"/>

  <rect width="900" height="1600" fill="#000" opacity="0.08"/>
</svg>
