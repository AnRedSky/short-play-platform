<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>剧本编辑器 · 长夜将明 · 长夜制作台 V4</title>
  <link rel="stylesheet" href="assets/css/studio.css">
  <style>
    .script-grid { display:grid;grid-template-columns:188px minmax(0,1fr) 268px;gap:16px;align-items:start }
    .scene-list { max-height:calc(100vh - 220px);overflow:auto;padding:8px }
    .scene-item { display:flex;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent }
    .scene-item:hover { background:var(--surface-2) }
    .scene-item.active { background:var(--accent-soft);border-color:#f0d0c7 }
    .scene-item .sn { font-family:var(--font-mono);font-size:9.5px;color:var(--muted);width:16px;padding-top:2px }
    .scene-item .st { flex:1;min-width:0 }
    .scene-item .st b { display:block;font-size:11.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis }
    .scene-item .st span { font-size:9.5px;color:var(--muted) }
    .scene-block { margin-bottom:8px;border-radius:6px;padding:2px 6px 8px;transition:background .15s }
    .scene-block.active { background:rgba(226,85,61,.055);box-shadow:0 0 0 1px rgba(226,85,61,.16) }
    .scene-block[contenteditable="true"] { outline:1px dashed #cdbfa4;outline-offset:3px }
    .scene-block[contenteditable="true"]:focus { outline:1px solid var(--accent) }
    .script-paper { max-height:calc(100vh - 236px);overflow:auto }
    .script-paper .sp-scene { display:flex;align-items:baseline;gap:8px }
    .script-paper .sp-scene .sc-no { font-family:var(--font-mono);font-size:10px;color:#8b8172 }
    .dirty-dot { width:7px;height:7px;border-radius:50%;background:var(--warning);display:inline-block;margin-right:5px;vertical-align:middle }
    @media (max-width:1180px){ .script-grid{grid-template-columns:160px minmax(0,1fr)} .script-grid > .stack{display:none} }
    @media (max-width:860px){ .script-grid{grid-template-columns:1fr} .scene-list{max-height:180px} .script-paper{max-height:none} }
  </style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="page" style="padding-top:22px">
      <div class="page-head" style="margin-bottom:16px">
        <div class="ph-main">
          <span class="eyebrow">Script editor · EP01</span>
          <h1 class="page-title" id="pageTitle">雨夜书店</h1>
          <p class="page-desc" id="pageDesc">8 场 / 19 条对白 · 约 4,860 字 · 剧本 v6（已锁版）</p>
        </div>
        <div class="page-actions">
          <a class="btn" href="episodes.html">← 分集</a>
          <button class="btn" id="historyBtn">版本记录</button>
          <button class="btn" id="editBtn">编辑剧本</button>
          <button class="btn" id="aiBtn">AI 优化本场</button>
          <button class="btn btn-primary" id="saveBtn">保存新版本</button>
          <button class="btn btn-dark" id="lockBtn">锁定剧本</button>
        </div>
      </div>

      <div class="card" style="padding:10px 14px;overflow-x:auto;margin-bottom:16px">
        <div class="row" id="epChips" style="gap:6px;min-width:max-content"></div>
      </div>

      <div class="script-grid">
        <section class="card">
          <div class="card-head" style="padding:11px 12px"><div><h3 style="font-size:12px">场次</h3><div class="ch-sub" id="sceneCount">8 场</div></div><button class="icon-btn btn-sm" id="addScene" title="新增场次">＋</button></div>
          <div class="scene-list" id="sceneList"></div>
          <div class="card-foot" style="padding:9px 12px"><span class="tiny muted" id="wordFoot">4,860 字</span><span class="tiny muted">自动编号</span></div>
        </section>

        <section>
          <div class="between mb-8" style="padding:0 4px">
            <div class="row"><span class="tiny muted" id="editState">只读模式 · 点击「编辑剧本」开始修改</span><span id="dirtyTag" style="display:none;color:var(--warning)" class="tiny"><span class="dirty-dot"></span>未保存</span></div>
            <div class="row tiny muted"><span>⌘S 保存</span><span>·</span><span>保存产生新版本</span></div>
          </div>
          <div class="script-paper" id="paper"></div>
        </section>

        <div class="stack" id="sidePanel">
          <section class="card card-pad">
            <div class="eyebrow">Episode</div>
            <div class="row mt-8" style="gap:8px"><span class="badge b-done" id="lockBadge">已锁版</span><span class="badge b-teal">8 场</span><span class="badge b-info">19 对白</span></div>
            <div class="kv mt-12" style="grid-template-columns:66px 1fr;font-size:11px">
              <span class="k">章节来源</span><span class="v">第 1–2 章</span>
              <span class="k">目标时长</span><span class="v">110 秒</span>
              <span class="k">画幅</span><span class="v">9:16</span>
              <span class="k">锁版时间</span><span class="v">今天 23:48</span>
            </div>
          </section>
          <section class="card">
            <div class="card-head" style="padding:12px 16px"><h3 style="font-size:12px">本集引用</h3></div>
            <div class="card-body" style="padding:6px 16px 12px" id="refs"></div>
            <div class="card-foot" style="padding:9px 16px"><a class="tiny" href="assets.html" style="color:var(--accent)">资产库</a><a class="tiny" href="storyboard.html" style="color:var(--accent)">分镜台 →</a></div>
          </section>
          <section class="card">
            <div class="card-head" style="padding:12px 16px"><h3 style="font-size:12px">剧本检查</h3></div>
            <div class="card-body" style="padding:8px 16px" id="checks"></div>
          </section>
          <div class="notice info"><span>保存会基于当前版本创建不可变新版本；并发编辑以版本号校验，冲突不会被静默覆盖。</span></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  SP.ui.mount('script','剧本编辑器');
  var epNo = SP.query('ep') || '01';
  var episode = SP.ep(epNo);
  var editing = false;
  var dirty = false;
  var activeScene = 0;

  if(!episode){ epNo='01'; episode=SP.ep('01'); }

  function scriptState(){
    var s=SP.get();
    if(!s.script) s.script={ep:'01',version:'v6',locked:true,savedAt:'今天 23:48'};
    return s.script;
  }

  function statusChip(e){
    var cls = e.status==='locked'?'b-done':e.status==='draft'?'b-info':'b-todo';
    return '<a class="chip '+(e.no===epNo?'on':'')+'" href="'+(e.status==='pending'?'#':'script.html?ep='+e.no)+'" data-epchip="'+e.no+'">EP'+e.no+' '+e.title+'</a>';
  }

  document.getElementById('epChips').innerHTML = SP.get().episodes.map(statusChip).join('');
  document.getElementById('epChips').addEventListener('click',function(e){
    var c=e.target.closest('[data-epchip]'); if(!c) return;
    var no=c.getAttribute('data-epchip'); var ep=SP.ep(no);
    if(ep.status==='pending'){ e.preventDefault(); SP.ui.toast('尚未生成','EP'+no+' 还没有剧本，请回到分集页生成。','warn'); }
  });

  document.getElementById('pageTitle').textContent = episode.title;
  document.getElementById('pageDesc').innerHTML = episode.status==='locked'
    ? '8 场 / 19 条对白 · 约 4,860 字 · 剧本 <b>v6（已锁版）</b>'
    : episode.status==='draft'
      ? '分集大纲已生成 · 尚未展开为完整剧本 · 草稿'
      : '尚未生成剧本 · 请回到分集页生成';

  var scenes = episode.no==='01' ? SP.get().scenes : [];

  function sceneHtml(sc, i){
    if(sc.html) return '<div class="scene-block" data-scene="'+i+'" id="scene-'+i+'"><div class="sp-scene"><span class="sc-no">'+String(sc.no).padStart(2,'0')+'</span><span>'+sc.setting+'</span></div>'+sc.html+'</div>';
    var body = sc.body.map(function(b){
      if(b[0]==='dialog') return '<div class="sp-dialog"><b>'+b[1]+'</b>'+b[2]+'</div>';
      return '<div class="sp-action">'+b[1]+'</div>';
    }).join('');
    return '<div class="scene-block" data-scene="'+i+'" id="scene-'+i+'"><div class="sp-scene"><span class="sc-no">'+String(sc.no).padStart(2,'0')+'</span><span>'+sc.setting+'</span></div>'+body+'</div>';
  }

  function renderPaper(){
    var paper=document.getElementById('paper');
    if(episode.no!=='01'){
      var content = episode.status==='pending'
        ? '<div class="sp-title">'+episode.title+'</div><div class="sp-meta">EP'+episode.no+' · 剧本尚未生成</div><div style="text-align:center;padding:60px 0;color:#8b8172;font-family:var(--font-sans);font-size:12px"><div style="font-family:var(--font-serif);font-size:18px;color:#3c352a;margin-bottom:6px">等待生成</div>该集目前只有分集钩子，没有场次与对白。<br><br><a class="btn btn-sm btn-primary" href="episodes.html">回到分集页生成</a></div>'
        : '<div class="sp-title">'+episode.title+'</div><div class="sp-meta">EP'+episode.no+' · 分集大纲草稿</div>'+
          '<div class="sp-scene">本集钩子</div><div class="sp-action">'+episode.hook+'</div><div class="sp-line"></div>'+
          '<div class="sp-scene">建议场次结构</div>'+
          [['1','开场 · 建立本集核心悬念','用一个具体的动作或物件把观众带进来，不解释背景。'],['2','推进 · 信息第一次反转','让角色以为自己掌握了线索，实际暴露新的缺口。'],['3','压迫 · 关系发生位移','通过一次对话或一次沉默，让两个人之间的权力关系改变。'],['4','钩子 · 留下未完成的动作','不要给答案。把镜头停在角色做出决定的前一秒。']].map(function(x){
            return '<div class="sp-scene" style="margin-top:16px"><span class="sc-no">'+x[0]+'</span><span>'+x[1]+'</span></div><div class="sp-action">'+x[2]+'</div>';
          }).join('')+'<div class="sp-line"></div><div style="text-align:center;font-family:var(--font-sans);font-size:11px;color:#8b8172">完整剧本需在分集页生成，或由编剧在此展开。</div>';
      paper.innerHTML=content;
      document.getElementById('sceneList').innerHTML='<div style="padding:14px 10px;color:var(--muted);font-size:11px">当前集没有场次。生成剧本后会自动按场次拆分。</div>';
      document.getElementById('sceneCount').textContent='0 场';
      document.getElementById('editBtn').disabled=true;
      document.getElementById('aiBtn').disabled=true;
      document.getElementById('saveBtn').disabled=true;
      document.getElementById('lockBtn').disabled=true;
      document.getElementById('lockBadge').className='badge '+(episode.status==='draft'?'b-info':'b-todo');
      document.getElementById('lockBadge').textContent=episode.status==='draft'?'草稿':'待生成';
      document.getElementById('wordFoot').textContent='—';
      return;
    }
    paper.innerHTML='<div class="sp-title">雨夜书店</div><div class="sp-meta">长夜将明 · EP01 · 剧本 '+scriptState().version+' · '+ (scriptState().locked?'已锁版':'草稿') +'</div>'+scenes.map(sceneHtml).join('');
    document.getElementById('sceneCount').textContent=scenes.length+' 场';
    document.getElementById('sceneList').innerHTML=scenes.map(function(sc,i){
      return '<div class="scene-item '+(i===activeScene?'active':'')+'" data-scene-item="'+i+'"><span class="sn">'+String(sc.no).padStart(2,'0')+'</span><span class="st"><b>'+sc.slug+'</b><span>'+sc.setting.replace(/外景 · |内景 · /,'')+'</span></span></div>';
    }).join('');
    updateWordCount();
    highlightScene();
  }

  function updateWordCount(){
    var paper=document.getElementById('paper');
    var n=(paper.innerText||'').replace(/\s/g,'').length;
    document.getElementById('wordFoot').textContent=n.toLocaleString()+' 字';
    document.getElementById('pageDesc').innerHTML='8 场 / 19 条对白 · 约 '+n.toLocaleString()+' 字 · 剧本 <b>'+scriptState().version+(scriptState().locked?'（已锁版）':'（草稿）')+'</b>';
  }

  function highlightScene(){
    document.querySelectorAll('.scene-block').forEach(function(b,i){ b.classList.toggle('active', i===activeScene); });
    document.querySelectorAll('[data-scene-item]').forEach(function(b,i){ b.classList.toggle('active', i===activeScene); });
  }

  document.getElementById('sceneList').addEventListener('click',function(e){
    var it=e.target.closest('[data-scene-item]'); if(!it) return;
    activeScene=Number(it.getAttribute('data-scene-item')); highlightScene();
    var target=document.getElementById('scene-'+activeScene); if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
  });

  function setDirty(v){
    dirty=v;
    document.getElementById('dirtyTag').style.display=v?'inline':'none';
    if(v) document.getElementById('editState').textContent='编辑中 · 修改尚未保存';
  }

  document.getElementById('editBtn').addEventListener('click',function(){
    if(episode.no!=='01') return;
    editing=!editing;
    document.querySelectorAll('.scene-block').forEach(function(b){ b.setAttribute('contenteditable',editing?'true':'false'); });
    this.textContent=editing?'完成编辑':'编辑剧本';
    document.getElementById('editState').textContent=editing?'编辑中 · 点击段落即可修改':'只读模式 · 点击「编辑剧本」开始修改';
    if(!editing && dirty){ SP.ui.toast('仍有未保存修改','点击「保存新版本」，或重新进入放弃修改。','warn'); }
  });

  document.getElementById('paper').addEventListener('input',function(e){
    if(!editing) return;
    var block=e.target.closest('.scene-block');
    if(block) activeScene=Number(block.getAttribute('data-scene'));
    setDirty(true); updateWordCount();
  });
  document.getElementById('paper').addEventListener('click',function(e){
    var b=e.target.closest('.scene-block'); if(!b) return; activeScene=Number(b.getAttribute('data-scene')); highlightScene();
  });

  function saveVersion(silent){
    if(episode.no!=='01') return;
    if(!dirty){ if(!silent) SP.ui.toast('没有改动','当前版本没有新的修改。','warn'); return; }
    var st=scriptState(); var v=parseInt(st.version.replace(/[^0-9]/g,''),10)+1;
    var htmls={};
    document.querySelectorAll('.scene-block').forEach(function(b,i){ htmls[i]=b.innerHTML.replace(/^<div class="sp-scene">[\s\S]*?<\/div>/,''); });
    SP.update(function(s){
      s.scenes.forEach(function(sc,i){ if(htmls[i]!==undefined) sc.html=htmls[i]; });
      if(!s.script) s.script={ep:'01',version:'v6',locked:true,savedAt:''};
      s.script.version='v'+v; s.script.locked=false; s.script.savedAt='刚刚';
      s.episodes[0].status='draft';
      s.activity.unshift([SP.ui.nowStamp(),'陈默','保存 EP01 剧本 v'+v,'script']);
    });
    setDirty(false);
    document.getElementById('lockBadge').className='badge b-info';
    document.getElementById('lockBadge').textContent='草稿';
    updateWordCount();
    SP.ui.toast('已保存 v'+v,'新版本已生成。剧本回到草稿状态，锁版后可进入下游生产。','success');
  }

  document.getElementById('saveBtn').addEventListener('click',function(){ saveVersion(false); });
  document.addEventListener('keydown',function(e){ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); saveVersion(false); } });

  document.getElementById('lockBtn').addEventListener('click',function(){
    if(episode.no!=='01'){ return; }
    SP.ui.confirm({title:'锁定剧本 v'+scriptState().version,
      message:'锁版后，剧本将作为下游资产、分镜与生成的唯一输入版本。',
      detail:'再次修改需要先解锁并产生新版本。已生成的镜头会被标记 stale。',
      okText:'锁定此版本'}).then(function(ok){
      if(!ok) return;
      SP.update(function(s){
        if(!s.script) s.script={ep:'01',version:'v6',locked:false};
        s.script.locked=true; s.episodes[0].status='locked';
        s.activity.unshift([SP.ui.nowStamp(),'陈默','锁定 EP01 剧本 '+s.script.version,'script']);
      });
      editing=false; document.querySelectorAll('.scene-block').forEach(function(b){ b.setAttribute('contenteditable','false'); });
      document.getElementById('editBtn').textContent='编辑剧本';
      document.getElementById('lockBadge').className='badge b-done'; document.getElementById('lockBadge').textContent='已锁版';
      updateWordCount(); renderRefs();
      SP.ui.toast('剧本已锁定','下游资产与分镜已绑定当前版本。','success');
    });
  });

  document.getElementById('aiBtn').addEventListener('click',function(){
    if(episode.no!=='01') return;
    var sc=scenes[activeScene];
    var body='<div class="notice info mb-12">'+SP.ui.icon('spark',15)+'<span>针对第 '+(activeScene+1)+' 场「'+sc.slug+'」生成 3 条建议。演示环境不调用真实模型。</span></div>'+
      '<div class="stack">'+
        '<div class="card card-pad" style="padding:13px 14px"><div class="between"><b style="font-size:12px">A · 压缩动作描述</b><span class="tag">推荐</span></div><p class="small muted mt-8" style="line-height:1.7">将前两句合并为一句，保留“雨砸玻璃”的动作与声音，删去重复的环境说明。</p><div class="small mt-8" style="font-family:var(--font-serif);color:var(--ink-2)">雨砸在玻璃上，像有人用指节敲门。整条街都灭了灯，只剩书店橱窗还亮着。</div></div>'+
        '<div class="card card-pad" style="padding:13px 14px"><div class="between"><b style="font-size:12px">B · 强化悬念落点</b></div><p class="small muted mt-8" style="line-height:1.7">在场景结尾补一个可被听见但无法解释的细节，让观众先于角色不安。</p><div class="small mt-8" style="font-family:var(--font-serif);color:var(--ink-2)">钟没有响。可周砚分明听见，柜台下面有什么东西，轻轻回了他一声。</div></div>'+
        '<div class="card card-pad" style="padding:13px 14px"><div class="between"><b style="font-size:12px">C · 收紧对白</b></div><p class="small muted mt-8" style="line-height:1.7">删掉 2 句解释性对白，保留沉默与动作，把信息留给下一场。</p></div>'+
      '</div>';
    var m=SP.ui.modal({title:'AI 优化 · 第 '+(activeScene+1)+' 场',sub:'基于当前锁版剧本与人物语气生成',size:'lg',body:body,
      footer:'<button class="btn" data-close>忽略</button><button class="btn btn-primary" id="applyB">采纳 B 并标记修改</button>'});
    m.el.querySelector('#applyB').addEventListener('click',function(){
      m.close();
      if(!editing){ document.getElementById('editBtn').click(); }
      var block=document.getElementById('scene-'+activeScene);
      var p=document.createElement('div'); p.className='sp-action'; p.textContent='钟没有响。可周砚分明听见，柜台下面有什么东西，轻轻回了他一声。';
      block.appendChild(p);
      setDirty(true); updateWordCount();
      SP.ui.toast('建议已插入','修改已加入当前场次，保存后会生成新版本。','success');
    });
  });

  function renderRefs(){
    var s=SP.get();
    var refs=[['周砚','REF v3','character'],['阿棠','REF v2','character'],['长夜书店','REF v4','scene'],['黑皮账簿','REF v2','prop'],['红围巾','REF v3','prop']];
    document.getElementById('refs').innerHTML=refs.map(function(r){
      return '<div class="list-row" style="padding:7px 0"><span class="lr-main"><span class="lr-title">'+r[0]+'</span><span class="lr-sub">'+r[1]+'</span></span><span class="tiny muted">引用</span></div>';
    }).join('');
    document.getElementById('checks').innerHTML=[
      ['场次编号连续','通过','b-done'],
      ['对白角色均有实体','通过','b-done'],
      ['时间线无跳跃','1 处提醒','b-warn'],
      ['敏感内容','通过','b-done']
    ].map(function(c){ return '<div class="list-row" style="padding:7px 0"><span class="lr-main"><span class="lr-title">'+c[0]+'</span></span><span class="badge '+c[2]+'" style="height:19px">'+c[1]+'</span></div>'; }).join('');
  }

  document.getElementById('historyBtn').addEventListener('click',function(){
    var cur=scriptState().version;
    var nums=parseInt(cur.replace(/[^0-9]/g,''),10);
    var list=[];
    for(var i=0;i<5;i++){
      var v=nums-i;
      list.push(['v'+v, i===0?'刚刚':(i===1?'今天 23:48':i===2?'昨天 22:10':i===3?'11-19 18:32':'11-18 16:05'), i===0?'陈默':(i===1?'陈默':i===2?'顾青':'白露'), i===0?'当前草稿':i===1?'锁版：调整第 5 场审讯节奏':i===2?'补写第 8 场阿棠台词':i===3?'合并第 4、5 场':'初稿']);
    }
    SP.ui.modal({title:'版本记录',sub:'每个版本不可变，可复制或对比',size:'lg',
      body:'<div class="stack">'+list.map(function(x,i){
        return '<div class="list-row"><span class="mono tiny muted" style="width:28px">'+x[0]+'</span><span class="lr-main"><span class="lr-title">'+x[3]+'</span><span class="lr-sub">'+x[1]+' · '+x[2]+'</span></span>'+
          (i===0?'<span class="badge b-info">当前</span>':'<button class="btn btn-xs" data-cmp="'+x[0]+'">对比</button>')+'</div>';
      }).join('')+'</div>',
      footer:'<button class="btn" data-close>关闭</button>',
      onMount:function(el){ el.querySelectorAll('[data-cmp]').forEach(function(b){ b.addEventListener('click',function(){ SP.ui.toast('版本对比','演示环境展示版本列表，不渲染逐字 diff。','warn'); }); }); }});
  });

  document.getElementById('addScene').addEventListener('click',function(){
    if(episode.no!=='01'){ return; }
    var m=SP.ui.modal({title:'新增场次',sub:'新场次会插入到当前选中场次之后',
      body:'<div class="form-grid">'+
        '<div class="field"><label>场景类型</label><select class="select"><option>内景</option><option>外景</option></select></div>'+
        '<div class="field"><label>地点</label><input class="input" placeholder="例如：长夜书店"></div>'+
        '<div class="field"><label>时间</label><select class="select"><option>夜</option><option>深夜</option><option>黎明</option></select></div>'+
        '<div class="field"><label>场次标题</label><input class="input" id="newSceneTitle" placeholder="例如：第三枚钥匙"></div>'+
        '<div class="field span2"><label>场次概要</label><textarea class="textarea" rows="2" placeholder="这场发生什么，谁改变了什么。"></textarea></div>'+
      '</div>',
      footer:'<button class="btn" data-close>取消</button><button class="btn btn-primary" id="addOk">插入场次</button>'});
    m.el.querySelector('#addOk').addEventListener('click',function(){
      var title=m.el.querySelector('#newSceneTitle').value.trim()||'未命名场次';
      SP.update(function(s){
        s.scenes.splice(activeScene+1,0,{id:SP.uid('sc'),no:0,slug:title,setting:'内景 · 长夜书店 · 夜',pages:'1.0',time:'—',chars:['周砚'],summary:'新增场次，待补写。',body:[['action','【待补写】雨声从门缝里进来。']]});
        s.scenes.forEach(function(sc,i){ sc.no=i+1; });
      });
      m.close(); scenes=SP.get().scenes; renderPaper(); setDirty(true);
      SP.ui.toast('场次已插入','记得补写内容并保存新版本。','success');
    });
  });

  renderPaper(); renderRefs();
  document.getElementById('lockBadge').className='badge '+(episode.status==='locked'?'b-done':episode.status==='draft'?'b-info':'b-todo');
  document.getElementById('lockBadge').textContent=episode.status==='locked'?'已锁版':episode.status==='draft'?'草稿':'待生成';
})();
</script>
</body>
</html>
