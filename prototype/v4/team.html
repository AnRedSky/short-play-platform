<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>团队与权限 · 长夜将明 · 长夜制作台 V4</title>
  <link rel="stylesheet" href="assets/css/studio.css">
  <style>
    .member-grid { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px }
    .member-grid #inviteCard { grid-column:1/-1;min-height:66px!important }
    .member-card { border:1px solid var(--line);background:#fff;border-radius:12px;padding:15px;cursor:pointer;transition:border-color .16s,transform .16s }
    .member-card:hover { border-color:#d4cbb8;transform:translateY(-1px) }
    .m-top { display:flex;align-items:center;gap:10px }
    .m-name { font-size:13px;font-weight:600 }
    .m-mail { font-size:10px;color:var(--muted);margin-top:1px }
    .m-role { margin-top:12px;display:flex;justify-content:space-between;align-items:center }
    .perm-on { color:var(--success);font-size:12px }
    .perm-off { color:#c9c4ba;font-size:12px }
    .perm-table td { text-align:center }
    .perm-table td:first-child { text-align:left }
    @media (max-width:1100px){ .member-grid{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media (max-width:660px){ .member-grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="page">
      <div class="page-head">
        <div class="ph-main">
          <span class="eyebrow">Team · Project members</span>
          <h1 class="page-title">团队与权限</h1>
          <p class="page-desc">项目是权限边界。成员只能看到自己被邀请的项目，角色决定可执行的动作，所有敏感操作写入审计日志。</p>
        </div>
        <div class="page-actions">
          <button class="btn" id="copyInvite">复制邀请链接</button>
          <button class="btn btn-primary" id="inviteBtn">＋ 邀请成员</button>
        </div>
      </div>

      <div class="grid g4">
        <div class="card stat"><div class="s-label">项目成员</div><div class="s-val" id="kMembers">6<small>人</small></div><div class="s-delta">含所有者 1 人</div></div>
        <div class="card stat"><div class="s-label">当前在线</div><div class="s-val" id="kOnline">4<small>人</small></div><div class="s-delta">过去 15 分钟活跃</div></div>
        <div class="card stat"><div class="s-label">待接受邀请</div><div class="s-val" id="kPending">0<small>人</small></div><div class="s-delta">7 天后自动失效</div></div>
        <div class="card stat"><div class="s-label">角色模板</div><div class="s-val">6<small>种</small></div><div class="s-delta">最小权限原则</div></div>
      </div>

      <div class="between mt-16 mb-8"><h3 style="font-size:13px">项目成员</h3><span class="tiny muted">点击成员卡片管理角色与权限</span></div>
      <div class="member-grid" id="memberGrid"></div>

      <div class="grid g-2-1 mt-16">
        <section class="card">
          <div class="card-head"><div><h3>角色权限矩阵</h3><div class="ch-sub">✓ 可执行 · — 无权限 · 审核与导出默认互斥</div></div><button class="btn btn-sm" id="roleHelp">权限说明</button></div>
          <div class="table-wrap">
            <table class="perm-table">
              <thead><tr><th style="width:128px">角色</th><th>项目</th><th>剧情</th><th>资产</th><th>分镜</th><th>生成</th><th>审核</th><th>剪辑</th><th>导出</th><th>成员</th></tr></thead>
              <tbody id="roleRows"></tbody>
            </table>
          </div>
          <div class="card-foot"><span class="tiny muted">权限只能由项目所有者调整</span><span class="tiny muted">变更实时生效</span></div>
        </section>
        <section class="card">
          <div class="card-head"><div><h3>审计日志</h3><div class="ch-sub">成员与权限变更</div></div></div>
          <div class="card-body" style="padding:6px 18px" id="audit"></div>
          <div class="card-foot"><a class="tiny" href="#" id="allLogs">查看全部日志 →</a><span class="tiny muted">保留 180 天</span></div>
        </section>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(function(){
  SP.ui.mount('team','团队与权限');

  function members(){ return SP.get().members; }
  function roles(){ return SP.get().roles; }

  function roleBadge(role){
    var map={'项目所有者':'b-warn','导演':'b-info','编剧':'b-teal','美术指导':'b-todo','剪辑师':'b-active','审核员':'b-done'};
    return '<span class="badge '+(map[role]||'b-todo')+'">'+role+'</span>';
  }

  function renderMembers(){
    var ms=members();
    document.getElementById('memberGrid').innerHTML=ms.map(function(m,i){
      return '<div class="member-card" data-member="'+i+'">'+
        '<div class="m-top"><span class="avatar '+(m.color||'')+'">'+m.initial+'</span><div style="flex:1;min-width:0"><div class="m-name">'+m.name+'</div><div class="m-mail truncate">'+m.email+'</div></div>'+
        '<span class="dot '+(m.status==='在线'?'on':m.status==='待接受'?'warn':'')+'"></span></div>'+
        '<div class="m-role">'+roleBadge(m.role)+'<span class="tiny muted">'+m.last+'</span></div>'+
        '<div class="between mt-8"><span class="tiny muted">'+m.dept+'</span><span class="tiny" style="color:var(--accent)">管理 →</span></div>'+
      '</div>';
    }).join('') + '<div class="member-card" id="inviteCard" style="border-style:dashed;display:flex;align-items:center;justify-content:center;min-height:112px;color:var(--muted)"><div style="text-align:center"><div style="font-size:20px">＋</div><div class="small mt-4">邀请新成员</div></div></div>';
    document.getElementById('kMembers').innerHTML=ms.length+'<small>人</small>';
    document.getElementById('kOnline').innerHTML=ms.filter(function(m){return m.status==='在线';}).length+'<small>人</small>';
    document.getElementById('kPending').innerHTML=ms.filter(function(m){return m.status==='待接受';}).length+'<small>人</small>';
  }

  document.getElementById('memberGrid').addEventListener('click',function(e){
    var c=e.target.closest('[data-member]');
    if(c){ openMember(Number(c.getAttribute('data-member'))); return; }
    if(e.target.closest('#inviteCard')) invite();
  });

  function renderRoles(){
    var cols=['项目','剧情','资产','分镜','生成','审核','剪辑','导出','成员'];
    document.getElementById('roleRows').innerHTML=roles().map(function(r){
      return '<tr><td><b class="t-strong">'+r.name+'</b><span class="t-sub">'+r.desc+'</span></td>'+
        cols.map(function(c){return '<td>'+(r.perms.indexOf(c)>-1?'<span class="perm-on">✓</span>':'<span class="perm-off">—</span>')+'</td>';}).join('')+'</tr>';
    }).join('');
  }

  function renderAudit(){
    var s=SP.get();
    var base=[
      ['09:12','陈默','将 周可 的角色设为 审核员','team'],
      ['昨天 18:40','陈默','修改 苏禾 的项目角色为 导演','team'],
      ['11-18 16:22','陈默','为 白露 开启资产库与分镜访问','team'],
      ['11-17 10:05','系统','启用项目邀请链接，有效期 7 天','team'],
      ['11-15 14:30','陈默','移除外部协作账号 wangxiao@ext.cn','team']
    ];
    var live=(s.activity||[]).filter(function(a){return a[3]==='team';}).map(function(a){return [a[0],a[1],a[2],'team'];});
    var logs=live.concat(base).slice(0,6).map(function(a){
      return '<div class="list-row" style="padding:8px 0"><span class="tiny muted" style="width:66px;flex:0 0 66px">'+a[0]+'</span><span class="lr-main"><span class="lr-title" style="font-weight:400">'+a[2]+'</span><span class="lr-sub">'+a[1]+' · 成员与权限</span></span></div>';
    }).join('');
    document.getElementById('audit').innerHTML=logs;
  }

  function openMember(i){
    var m=members()[i]; if(!m) return;
    var isOwner=m.role==='项目所有者';
    var roleOpts=roles().map(function(r){return '<option '+(r.name===m.role?'selected':'')+'>'+r.name+'</option>';}).join('');
    var d=SP.ui.drawer({eyebrow:'成员 · '+m.status,title:m.name,sub:m.email+' · '+m.dept,
      body:'<div class="row" style="gap:14px;align-items:flex-start"><span class="avatar '+(m.color||'')+'" style="width:52px;height:52px;font-size:20px">'+m.initial+'</span>'+
        '<div style="flex:1"><div class="kv" style="grid-template-columns:64px 1fr;font-size:11px"><span class="k">加入时间</span><span class="v">2026-10-18</span><span class="k">最近活跃</span><span class="v">'+m.last+'</span><span class="k">当前项目</span><span class="v">长夜将明</span></div></div></div>'+
        '<div style="border-top:1px solid var(--line);margin:16px 0"></div>'+
        '<div class="field"><label>项目角色</label><select class="select" id="mRole" '+(isOwner?'disabled':'')+'>'+roleOpts+'</select><span class="hint">'+(isOwner?'项目所有者不可变更。':'角色变更会立即影响该成员可访问的页面与操作。')+'</span></div>'+
        '<div class="tiny muted mt-16 mb-8">项目访问范围</div>'+
        '<label class="checkline"><input type="checkbox" checked disabled> 长夜将明（当前项目）</label>'+
        '<label class="checkline mt-8"><input type="checkbox"> 春日故障（只读）</label>'+
        '<div class="tiny muted mt-16 mb-8">高风险权限</div>'+
        '<label class="checkline"><input type="checkbox" '+(m.role==='项目所有者'?'checked':'')+'> 审核结论与导出放行</label>'+
        '<label class="checkline mt-8"><input type="checkbox" '+(m.role==='项目所有者'?'checked':'')+'> 邀请与移除成员</label>'+
        (isOwner?'':'<div class="notice warn mt-12"><span>移除成员会立即撤销其会话与导出下载权限。</span></div>'),
      footer:'<button class="btn" data-close>关闭</button>'+(isOwner?'<button class="btn btn-primary" data-close>完成</button>':'<button class="btn btn-danger" id="mRemove">移除成员</button><button class="btn btn-primary" id="mSave">保存变更</button>'),
      onMount:function(el,close){
        var save=el.querySelector('#mSave');
        if(save) save.addEventListener('click',function(){
          var nr=el.querySelector('#mRole').value;
          SP.update(function(s){ s.members[i].role=nr; s.activity.unshift([SP.ui.nowStamp(),'陈默','修改 '+m.name+' 的角色为 '+nr,'team']); });
          close(); renderMembers(); renderAudit(); SP.ui.toast('角色已更新',m.name+' → '+nr,'success');
        });
        var rm=el.querySelector('#mRemove');
        if(rm) rm.addEventListener('click',function(){
          close();
          SP.ui.confirm({title:'移除成员',message:'确定将 '+m.name+' 移出「长夜将明」？',detail:'其会话与产物下载权限立即失效，历史操作记录保留。',danger:true,okText:'移除'}).then(function(ok){
            if(!ok) return;
            SP.update(function(s){ s.members=s.members.filter(function(x){return x.email!==m.email;}); s.activity.unshift([SP.ui.nowStamp(),'陈默','移除成员 '+m.name,'team']); });
            renderMembers(); renderAudit(); SP.ui.toast('成员已移除',m.name+' 已离开项目。','warn');
          });
        });
      }});
  }

  function invite(){
    var m=SP.ui.modal({title:'邀请成员',sub:'邀请链接 7 天内有效，接受后加入当前项目',
      body:'<div class="form-grid">'+
        '<div class="field span2"><label>邮箱 <span class="req">*</span></label><input class="input" id="ivMail" placeholder="name@studio.cn"><span class="hint">仅支持工作室邮箱域名的成员</span><div class="err-msg" id="ivErr">请输入有效邮箱，且不能是已有成员</div></div>'+
        '<div class="field"><label>角色</label><select class="select" id="ivRole">'+roles().filter(function(r){return r.name!=='项目所有者';}).map(function(r){return '<option>'+r.name+'</option>';}).join('')+'</select></div>'+
        '<div class="field"><label>部门</label><select class="select" id="ivDept"><option>内容组</option><option>视觉组</option><option>后期组</option><option>质控组</option><option>制作中心</option></select></div>'+
        '<div class="field span2"><label>附言</label><textarea class="textarea" rows="2" placeholder="邀请你加入《长夜将明》的制作，负责……"></textarea></div>'+
      '</div><div class="notice mt-12"><span>被邀请人只会看到「长夜将明」，看不到你其他项目。</span></div>',
      footer:'<button class="btn" data-close>取消</button><button class="btn btn-primary" id="ivSend">发送邀请</button>'});
    m.el.querySelector('#ivSend').addEventListener('click',function(){
      var mail=m.el.querySelector('#ivMail').value.trim(), role=m.el.querySelector('#ivRole').value, dept=m.el.querySelector('#ivDept').value;
      var ok=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail) && !members().some(function(x){return x.email===mail;});
      if(!ok){ m.el.querySelector('#ivErr').classList.add('show'); m.el.querySelector('#ivMail').classList.add('err'); return; }
      SP.update(function(s){ s.members.push({name:mail.split('@')[0],email:mail,role:role,dept:dept,status:'待接受',last:'邀请已发送',initial:mail.slice(0,1).toUpperCase(),color:'red'}); s.activity.unshift([SP.ui.nowStamp(),'陈默','邀请 '+mail+' 加入项目（'+role+'）','team']); });
      m.close(); renderMembers(); renderAudit(); SP.ui.toast('邀请已发送','链接有效期 7 天，成员接受后自动加入。','success');
    });
  }

  document.getElementById('inviteBtn').addEventListener('click',invite);
  document.getElementById('copyInvite').addEventListener('click',function(){
    var link='https://studio.local/invite/NYJM-26-7F3A';
    if(navigator.clipboard) navigator.clipboard.writeText(link).catch(function(){});
    SP.ui.toast('邀请链接已复制','7 天内有效 · 仅限受邀邮箱接受。','success');
  });

  document.getElementById('roleHelp').addEventListener('click',function(){
    SP.ui.modal({title:'权限模型',sub:'项目边界 + 角色最小权限',
      body:'<div class="stack"><div class="notice info"><span>成员必须先被加入项目，才能看到项目内的任何页面与资产。</span></div>'+
        '<div class="kv" style="grid-template-columns:92px 1fr"><span class="k">项目</span><span class="v">查看项目信息、成员与基础设置</span><span class="k">剧情</span><span class="v">故事圣经、分集与剧本编辑</span><span class="k">生成</span><span class="v">创建 AI 任务与重试失败任务</span><span class="k">审核</span><span class="v">提交质检、给出通过/退回结论</span><span class="k">导出</span><span class="v">创建导出任务与下载产物</span></div>'+
        '<div class="notice warn"><span>审核员默认没有导出权限；剪辑师默认没有审核权限，避免自审自导。</span></div></div>',
      footer:'<button class="btn btn-primary" data-close>我知道了</button>'});
  });

  document.getElementById('allLogs').addEventListener('click',function(e){
    e.preventDefault();
    var s=SP.get();
    SP.ui.modal({title:'项目审计日志',sub:'最近 30 条 · 保留 180 天',size:'lg',
      body:'<div class="stack" style="gap:0">'+(s.activity||[]).map(function(a){
        return '<div class="list-row" style="padding:9px 0"><span class="mono tiny muted" style="width:62px">'+a[0]+'</span><span class="lr-main"><span class="lr-title" style="font-weight:400">'+a[2]+'</span><span class="lr-sub">'+a[1]+' · '+a[3]+'</span></span></div>';
      }).join('')+'</div>',
      footer:'<button class="btn" data-close>关闭</button><button class="btn" id="logDl">导出日志</button>',
      onMount:function(el,close){
        el.querySelector('#logDl').addEventListener('click',function(){
          var text=(SP.get().activity||[]).map(function(a){return a.join(' | ');}).join('\n');
          var blob=new Blob([text],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');
          a.href=URL.createObjectURL(blob);a.download='NYJM-26_audit.log';a.click();
          SP.ui.toast('日志已导出','NYJM-26_audit.log','success');
        });
      }});
  });

  renderMembers(); renderRoles(); renderAudit();
})();
</script>
</body>
</html>
