<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>Smoke</title>
<style>body{font:12px/1.5 monospace;margin:12px}iframe{width:1280px;height:760px;border:1px solid #ccc}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">running…</pre>
<iframe id="f" src="/index.html?v=9.7.7"></iframe>
<script>
const out = [];
const errors = [];
const f = document.getElementById("f");
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const W = () => f.contentWindow;
const D = () => f.contentWindow.document;
const put = (t) => { document.getElementById("out").textContent = t; };

(async () => {
  const t0 = Date.now();
  /* App 在模块注册前就已存在，必须等 56 条路由全部注册完，否则只会跑到最先加载的少数路由 */
  while (Date.now() - t0 < 12000) {
    if (W().App && W().App.routes && W().App.routes().length >= 56) break;
    await wait(200);
  }
  if (!W().App) { put("FAIL app not ready"); return; }
  W().addEventListener("error", (e) => errors.push("JS " + e.message + " @" + (e.filename || "").split("/").pop() + ":" + e.lineno));
  W().addEventListener("unhandledrejection", (e) => errors.push("REJECT " + (e.reason && e.reason.message ? e.reason.message : e.reason)));

  const routes = W().App.routes().map((r) => r.path);
  const bad = [];
  if (routes.length < 56) bad.push("路由注册不完整：仅 " + routes.length + " 条（期望 56），本次只覆盖部分页面");
  for (const p of routes) {
    const n0 = errors.length;
    W().location.hash = "#/" + p;
    await wait(400);
    const view = D().querySelector("#view");
    const text = view ? view.textContent : "";
    const flags = [];
    if (!view || text.trim().length < 20) flags.push("EMPTY");
    if (/undefined|NaN|\[object Object\]/.test(text)) flags.push("BADTEXT");
    if (errors.length > n0) flags.push("JSERR");
    if (flags.length) bad.push(p + " → " + flags.join(",") + (errors.length > n0 ? " | " + errors.slice(n0).join(" ; ") : ""));
  }

  /* 角色遍历：staff 打开需要写权限的路由应出现 403 提示而非空白 */
  const roleBad = [];
  for (const id of ["i-staff", "i-auditor", "i-admin"]) {
    const sel = D().getElementById("identity-switch");
    sel.value = id; sel.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(300);
    for (const p of ["projects/new", "video/production", "cost/budget", "orgs/members"]) {
      W().location.hash = "#/" + p;
      await wait(350);
      const text = (D().querySelector("#view") || {}).textContent || "";
      const hasGuard = /无权|权限|403/.test(text);
      const empty = text.trim().length < 20;
      if (empty && !hasGuard) roleBad.push(id + " " + p + " 空白且无权限提示");
    }
  }

  /* 合并页 tab 断言（B2 归并后 9 个宿主页的 tab 必须渲染出真实内容）
     切 tab 前先把身份重置为项目负责人，否则上一步的角色遍历会停在无权限身份上 */
  const setIdentity = async (id) => {
    const sel = D().getElementById("identity-switch");   // 每次重新取：切身份会重建侧栏，旧引用会失效
    if (!sel) return;
    sel.value = id;
    sel.dispatchEvent(new Event("change", { bubbles: true }));
    await wait(400);
  };
  await setIdentity("i-owner");
  const tabCases = [
    ["projects/list", "projects.setRel", "own"], ["quality/reports", "quality.tab", "gates"],
    ["post/delivery", "post.tab", "works"], ["video/preview", "video.tab", "versions"],
    ["director/shots", "director.view", "board"], ["assets/library", "assets.tab", "refs"],
    ["cost/ledger", "cost.tab", "usage"], ["compliance/risks", "compliance.tab", "dispose"],
    ["analytics/enterprise", "analytics.tab", "depts", "i-admin"]
  ];
  const tabBad = [];
  for (const [p, action, v, asId] of tabCases) {
    if (asId) await setIdentity(asId);
    W().location.hash = "#/" + p;
    await wait(500);
    const chip = D().querySelector('#view button[data-action="' + action + '"][data-value="' + v + '"]');
    if (!chip) { tabBad.push(p + " 缺少 " + action + "=" + v + " 的切换控件"); continue; }
    chip.dispatchEvent(new Event("click", { bubbles: true }));
    await wait(400);
    const text = (D().querySelector("#view") || {}).textContent || "";
    if (text.trim().length < 20) tabBad.push(p + " " + action + "=" + v + " 渲染为空");
    if (/undefined|NaN|\[object Object\]/.test(text)) tabBad.push(p + " " + action + "=" + v + " 含 undefined/NaN");
  }

  put("routes=" + routes.length + "\n" + (bad.length ? "ROUTE ISSUES:\n" + bad.join("\n") : "所有路由渲染正常，无 JS 错误、无 undefined/NaN") +
    "\n" + "tabs=" + tabCases.length + "\n" + (tabBad.length ? "TAB ISSUES:\n" + tabBad.join("\n") : "合并页 tab 切换均渲染出内容") +
    "\n" + (roleBad.length ? "ROLE ISSUES:\n" + roleBad.join("\n") : "角色切换后权限拦截均有提示") +
    "\n" + (errors.length ? "ERRORS:\n" + errors.join("\n") : "无全局 JS 错误") + "\n\nDONE");
  document.title = "Smoke " + (bad.length || roleBad.length || tabBad.length ? "FAIL" : "OK");
})().catch((e) => put("FATAL " + e.message + "\n" + e.stack));
</script>
</body>
</html>
