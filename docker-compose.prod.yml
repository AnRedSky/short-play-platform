# Enterprise private deployment overlay: internal Linux + Docker, no SaaS exposure.
# Usage: docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Differences from docker-compose.yml (development):
#   * every service restarts automatically and has a restart policy
#   * PostgreSQL and Redis are never published on the host network
#   * media storage is a named volume shared by api and worker only
#   * TLS termination and request-size limits live in the nginx service

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-short_play}
      POSTGRES_USER: ${POSTGRES_USER:-short_play}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-short_play} -d ${POSTGRES_DB:-short_play}
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-short_play}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ROOT: /data/storage
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-524288000}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://short-play.internal"]}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - uv run --no-sync alembic upgrade head && exec uv run --no-sync uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-short_play}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ROOT: /data/storage
    volumes:
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - apps.api.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --concurrency=2

  beat:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-short_play}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - apps.api.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  media_storage:
