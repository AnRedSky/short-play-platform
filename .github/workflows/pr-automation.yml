name: Pull request automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [develop, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  policy:
    name: PR policy gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR metadata and branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "develop" || "$BASE_REF" == "main" ]] || { echo "Unsupported target branch: $BASE_REF"; exit 1; }
          [[ "$DRAFT" == "false" ]] || { echo "Draft PRs are not eligible for delivery."; exit 1; }
          [[ "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\([a-z0-9._-]+\))?:\ .+ ]] || { echo "PR title must follow Conventional Commits."; exit 1; }
          [[ "$PR_BODY" =~ (Closes|Fixes|Resolves|Refs)[[:space:]]+#([0-9]+) ]] || { echo "PR body must reference a GitHub Issue."; exit 1; }
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "develop" && "$HEAD_REF" != release/* && "$HEAD_REF" != hotfix/* ]]; then
            echo "Only develop, release/*, or hotfix/* may target main."; exit 1
          elif [[ "$BASE_REF" == "develop" && "$HEAD_REF" != hotfix/* && "$HEAD_REF" != docs/* ]]; then
            echo "Only hotfix synchronization or documentation-governance PRs may target develop; routine development integrates directly into develop."; exit 1
          fi

  automatic-delivery:
    name: Automatic merge after successful CI
    needs: policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Wait for all CI jobs and merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            CURRENT_SHA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json headRefOid --jq '.headRefOid')"
            [[ "$CURRENT_SHA" == "$HEAD_SHA" ]] || { echo "PR head changed during validation; a new workflow run must validate the new commit."; exit 1; }
            DATA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json statusCheckRollup)"
            CHECKS="$(jq '[.statusCheckRollup[]? | select(.workflowName == "CI")]' <<< "$DATA")"
            COUNT="$(jq 'length' <<< "$CHECKS")"
            if [[ "$COUNT" -ge 3 ]]; then
              FAILED="$(jq '[.[] | select(.status == "COMPLETED" and .conclusion != "SUCCESS")] | length' <<< "$CHECKS")"
              PENDING="$(jq '[.[] | select(.status != "COMPLETED")] | length' <<< "$CHECKS")"
              [[ "$FAILED" -eq 0 ]] || { echo "CI failed; automatic delivery is blocked."; exit 1; }
              if [[ "$PENDING" -eq 0 ]]; then
                gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --squash --delete-branch
                exit 0
              fi
            fi
            echo "Waiting for CI completion ($attempt/120); observed $COUNT CI checks."
            sleep 10
          done
          echo "Timed out waiting for CI; PR remains open."
          exit 1

# Delivery is unattended: no per-PR user confirmation or manual approval is required.
# The workflow waits for all three independent CI jobs to succeed before merging.
# Issue closure is handled by GitHub closing keywords only when a PR merges into main.
