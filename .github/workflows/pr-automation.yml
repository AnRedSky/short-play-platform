name: Pull request automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [develop, main]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  policy:
    name: PR policy gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR metadata and branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "develop" || "$BASE_REF" == "main" ]] || { echo "Unsupported target branch: $BASE_REF"; exit 1; }
          [[ "$DRAFT" == "false" ]] || { echo "Draft PRs are not eligible for delivery."; exit 1; }
          [[ "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\([a-z0-9._-]+\))?:\ .+ ]] || { echo "PR title must follow Conventional Commits."; exit 1; }
          [[ "$PR_BODY" =~ (Closes|Fixes|Resolves|Refs)[[:space:]]+#([0-9]+) ]] || { echo "PR body must reference a GitHub Issue."; exit 1; }
          if [[ "$BASE_REF" == "main" ]]; then
            # Only a formal delivery PR into main may close Issues, so it must carry a closing keyword.
            [[ "$PR_BODY" =~ (Closes|Fixes|Resolves)[[:space:]]+#([0-9]+) ]] || {
              echo "PRs targeting main must close the delivered Issues with Closes/Fixes/Resolves."
              exit 1
            }
            [[ "$HEAD_REF" == "develop" || "$HEAD_REF" == release/* || "$HEAD_REF" == hotfix/* ]] || {
              echo "Only develop, release/* or hotfix/* may target main."
              exit 1
            }
          elif [[ "$HEAD_REF" != hotfix/* && "$HEAD_REF" != docs/* ]]; then
            echo "Only hotfix synchronization or documentation-governance PRs may target develop; routine development integrates directly into develop."
            exit 1
          fi

  automatic-delivery:
    name: Automatic merge after successful CI
    if: |
      github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.name == 'CI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      issues: write
    steps:
      - name: Verify exact tested commit, PR policy and mergeability before delivery
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          PR_JSON="$(gh pr list --repo "$REPOSITORY" --state open --head "$HEAD_BRANCH" --json number,headRefOid,headRefName,baseRefName,isDraft)"
          PR_NUMBER="$(jq -r --arg sha "$CI_HEAD_SHA" '[.[] | select(.headRefOid == $sha and .isDraft == false)] | first | .number // empty' <<< "$PR_JSON")"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open non-draft PR has the exact CI-tested head SHA $CI_HEAD_SHA on branch $HEAD_BRANCH. Nothing to merge."
            exit 0
          fi

          PR="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json number,title,body,state,headRefOid,headRefName,baseRefName,isDraft,mergeable)"
          STATE="$(jq -r '.state' <<< "$PR")"
          BASE="$(jq -r '.baseRefName' <<< "$PR")"
          HEAD="$(jq -r '.headRefName' <<< "$PR")"
          CURRENT_SHA="$(jq -r '.headRefOid' <<< "$PR")"
          DRAFT="$(jq -r '.isDraft' <<< "$PR")"

          [[ "$STATE" == "OPEN" ]] || { echo "PR #$PR_NUMBER is not open: $STATE"; exit 1; }
          [[ "$CURRENT_SHA" == "$CI_HEAD_SHA" ]] || { echo "PR head changed after CI: tested=$CI_HEAD_SHA current=$CURRENT_SHA"; exit 1; }
          [[ "$DRAFT" == "false" ]] || { echo "Draft PR cannot be merged."; exit 1; }

          if [[ "$BASE" == "main" && "$HEAD" != "develop" && "$HEAD" != release/* && "$HEAD" != hotfix/* ]]; then
            echo "Branch policy rejected $HEAD -> $BASE."; exit 1
          fi
          if [[ "$BASE" == "develop" && "$HEAD" != hotfix/* && "$HEAD" != docs/* ]]; then
            echo "Branch policy rejected $HEAD -> $BASE."; exit 1
          fi

          # CI and the PR policy gate must both succeed for the exact head SHA being merged.
          # The PR policy gate may still be running when CI finishes, so wait for it instead of
          # failing the delivery outright.
          REQUIRED_CHECKS=("backend-quality" "frontend-quality" "compose-validation" "PR policy gate")
          SECONDS=0
          while :; do
            CHECKS="$(gh api "repos/$REPOSITORY/commits/$CI_HEAD_SHA/check-runs?per_page=100")"
            PENDING=0
            for REQUIRED_CHECK in "${REQUIRED_CHECKS[@]}"; do
              CONCLUSION="$(jq -r --arg name "$REQUIRED_CHECK" '[.check_runs[] | select(.name == $name)] | sort_by(.started_at) | last | if .status == "completed" then .conclusion else "pending" end // "missing"' <<< "$CHECKS")"
              case "$CONCLUSION" in
                success) ;;
                pending|missing) PENDING=1 ;;
                *)
                  echo "Required check $REQUIRED_CHECK did not succeed for $CI_HEAD_SHA: $CONCLUSION"
                  exit 1
                  ;;
              esac
            done
            if [[ "$PENDING" -eq 0 ]]; then
              echo "All required checks succeeded for $CI_HEAD_SHA."
              break
            fi
            if (( SECONDS >= 300 )); then
              echo "Timed out waiting for required checks on $CI_HEAD_SHA."
              exit 1
            fi
            sleep 10
          done

          MERGEABLE="UNKNOWN"
          for attempt in $(seq 1 5); do
            MERGEABLE="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json mergeable --jq '.mergeable')"
            [[ "$MERGEABLE" == "UNKNOWN" ]] || break
            sleep 2
          done
          [[ "$MERGEABLE" == "MERGEABLE" ]] || { echo "PR is not mergeable: $MERGEABLE"; exit 1; }

          if [[ "$BASE" == "main" && "$HEAD" == "develop" ]]; then
            MERGE_METHOD="merge"
          else
            MERGE_METHOD="squash"
          fi

          echo "All gates passed for PR #$PR_NUMBER at $CI_HEAD_SHA. Merging with $MERGE_METHOD."
          MERGE_RESULT="$(gh api --method PUT "repos/$REPOSITORY/pulls/$PR_NUMBER/merge" -f sha="$CI_HEAD_SHA" -f merge_method="$MERGE_METHOD")"
          [[ "$(jq -r '.merged' <<< "$MERGE_RESULT")" == "true" ]] || { echo "GitHub did not confirm merge: $MERGE_RESULT"; exit 1; }
          echo "Merged PR #$PR_NUMBER with commit $(jq -r '.sha' <<< "$MERGE_RESULT")."

          if [[ "$BASE" == "main" ]]; then
            # GitHub already applies closing keywords for most merges into the default branch. The
            # delivery gate re-checks and closes only Issues that are still open, so the two
            # mechanisms cannot fight each other. A failure to close a delivered Issue is a real
            # delivery failure, but an Issue that GitHub already closed is normal and never aborts.
            ISSUE_NUMBERS="$(jq -r '.body // ""' <<< "$PR" \
              | grep -oiE '(Closes|Fixes|Resolves)[[:space:]]*#[0-9]+' \
              | grep -oE '[0-9]+' | sort -u || true)"
            if [[ -z "$ISSUE_NUMBERS" ]]; then
              echo "WARNING: delivery PR #$PR_NUMBER did not reference any closing keyword."
            fi
            for ISSUE_NUMBER in $ISSUE_NUMBERS; do
              ISSUE_STATE="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq '.state' 2>/dev/null || echo unknown)"
              if [[ "$ISSUE_STATE" == "open" ]]; then
                if gh api --method PATCH "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --input - <<< '{"state":"closed","state_reason":"completed"}' > /dev/null 2>&1; then
                  echo "Closed delivered Issue #$ISSUE_NUMBER."
                else
                  # Fall back to the plain CLI close, which is idempotent for an already closed Issue.
                  if gh issue close "$ISSUE_NUMBER" --repo "$REPOSITORY" --reason completed > /dev/null 2>&1; then
                    echo "Closed delivered Issue #$ISSUE_NUMBER via gh issue close."
                  else
                    echo "ERROR: failed to close delivered Issue #$ISSUE_NUMBER." >&2
                    CLOSE_FAILED=1
                  fi
                fi
              else
                echo "Issue #$ISSUE_NUMBER is already $ISSUE_STATE; nothing to do."
              fi
              FINAL_STATE="$(gh api "repos/$REPOSITORY/issues/$ISSUE_NUMBER" --jq '.state' 2>/dev/null || echo unknown)"
              echo "Issue #$ISSUE_NUMBER final state: $FINAL_STATE"
            done
            if [[ "${CLOSE_FAILED:-0}" == "1" ]]; then
              echo "Delivery completed but at least one delivered Issue stayed open." >&2
              exit 1
            fi
          fi

          if [[ "$MERGE_METHOD" == "squash" && "$HEAD" != "main" && "$HEAD" != "develop" ]]; then
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$HEAD"
          fi

# CI and PR policy checks must refer to the same immutable head SHA.
# The GitHub merge API receives that SHA as its expected-head guard against races.
# develop -> main uses a merge commit and never deletes develop.
# Short-lived release/hotfix/docs exceptions use squash and are deleted after successful merge.
# Issue closure is handled by GitHub closing keywords only when a PR merges into main.
