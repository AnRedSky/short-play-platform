name: Pull request automation

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, edited]
    branches: [develop, main]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-automation-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  policy:
    name: PR policy gate
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR metadata and branch policy
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          [[ "$BASE_REF" == "develop" || "$BASE_REF" == "main" ]] || { echo "Unsupported target branch: $BASE_REF"; exit 1; }
          [[ "$DRAFT" == "false" ]] || { echo "Draft PRs are not eligible for merge."; exit 1; }
          [[ "$PR_TITLE" =~ ^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\([a-z0-9._-]+\))?:\ .+ ]] || { echo "PR title must follow Conventional Commits."; exit 1; }
          [[ "$PR_BODY" =~ (Closes|Fixes|Resolves|Refs)[[:space:]]+#([0-9]+) ]] || { echo "PR body must reference a GitHub Issue (Closes/Refs #123)."; exit 1; }
          if [[ "$BASE_REF" == "main" && "$HEAD_REF" != "develop" && "$HEAD_REF" != release/* && "$HEAD_REF" != hotfix/* ]]; then
            echo "Only develop, release/*, or hotfix/* may target main."; exit 1
          elif [[ "$BASE_REF" == "develop" && "$HEAD_REF" != hotfix/* ]]; then
            echo "Only hotfix/* synchronization PRs may target develop; normal work integrates directly into develop."; exit 1
          fi

  enable-auto-merge-after-review:
    name: Enable auto-merge after approval and checks
    needs: policy
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Require independent approval and successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          DATA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json reviewDecision,statusCheckRollup)"
          DECISION="$(jq -r '.reviewDecision // "REVIEW_REQUIRED"' <<< "$DATA")"
          [[ "$DECISION" == "APPROVED" ]] || { echo "Waiting for an independent human approval."; exit 1; }
          CHECKS="$(jq '[.statusCheckRollup[]? | select((.name // .context // "") != "PR policy gate") | select((.workflowName // "") != "Pull request automation")]' <<< "$DATA")"
          COUNT="$(jq 'length' <<< "$CHECKS")"
          [[ "$COUNT" -gt 0 ]] || { echo "No independent CI status checks found; auto-merge is blocked."; exit 1; }
          jq -e 'all(.[]; ((.conclusion // .state // "") == "SUCCESS"))' <<< "$CHECKS" >/dev/null || { echo "One or more independent CI checks are not successful."; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash

  enable-auto-merge-after-ci:
    name: Enable auto-merge after CI completes
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Find associated PR and verify review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          PR_NUMBER="$(gh pr list --repo "$REPOSITORY" --state open --json number,headRefName,baseRefName --jq '.[] | select(.headRefName == env.HEAD_BRANCH and (.baseRefName == "develop" or .baseRefName == "main")) | .number' | head -n 1)"
          [[ -n "$PR_NUMBER" ]] || { echo "No open integration/release PR found for CI branch."; exit 0; }
          DATA="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json reviewDecision,statusCheckRollup)"
          [[ "$(jq -r '.reviewDecision // "REVIEW_REQUIRED"' <<< "$DATA")" == "APPROVED" ]] || { echo "Waiting for independent human approval."; exit 1; }
          CHECKS="$(jq '[.statusCheckRollup[]? | select((.name // .context // "") != "PR policy gate") | select((.workflowName // "") != "Pull request automation")]' <<< "$DATA")"
          COUNT="$(jq 'length' <<< "$CHECKS")"
          [[ "$COUNT" -gt 0 ]] || { echo "No independent CI status checks found; auto-merge is blocked."; exit 1; }
          jq -e 'all(.[]; ((.conclusion // .state // "") == "SUCCESS"))' <<< "$CHECKS" >/dev/null || { echo "One or more independent CI checks are not successful."; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$REPOSITORY" --auto --squash

# Human review is required; automation never submits APPROVE and never bypasses branch rules.
# Issue closure is handled by GitHub's native closing keywords only when a PR merges into main.
