name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: short_play
          POSTGRES_USER: short_play
          POSTGRES_PASSWORD: short_play
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U short_play -d short_play"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://short_play:short_play@localhost:5432/short_play
      REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml
      - name: Set up Python
        run: uv python install 3.12
      - name: Install backend dependencies
        run: uv sync --all-groups
      - name: Ruff
        run: uv run ruff check .
      - name: Apply migrations to an empty PostgreSQL database
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q
      - name: Start Celery worker and verify broker round-trip
        run: |
          set -euo pipefail
          .venv/bin/celery -A apps.api.workers.celery_app:celery_app worker --pool=solo --without-gossip --without-mingle --without-heartbeat --loglevel=INFO > /tmp/short-play-celery.log 2>&1 &
          WORKER_PID=$!
          cleanup() {
            kill "$WORKER_PID" 2>/dev/null || true
            wait "$WORKER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if ! kill -0 "$WORKER_PID" 2>/dev/null; then
              cat /tmp/short-play-celery.log
              echo "Celery worker exited before becoming ready."
              exit 1
            fi
            if .venv/bin/celery -A apps.api.workers.celery_app:celery_app inspect ping --timeout=1 2>/dev/null | grep -qi pong; then
              echo "Celery worker responded to ping."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/short-play-celery.log
          echo "Celery worker did not respond to ping."
          exit 1

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  compose-validation:
    name: compose-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
