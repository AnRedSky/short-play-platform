name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: short_play
          POSTGRES_USER: short_play
          POSTGRES_PASSWORD: short_play
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U short_play -d short_play"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://short_play:short_play@localhost:5432/short_play
      REDIS_URL: redis://localhost:6379/0
      STORAGE_ROOT: ${{ runner.temp }}/short-play-storage
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install backend dependencies from the committed lock file
        run: uv sync --locked --all-groups
      - name: Install FFmpeg and ffprobe for real media tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Ruff
        run: uv run ruff check .
      - name: Apply migrations to an empty PostgreSQL database
        run: uv run alembic upgrade head
      - name: Pytest
        run: uv run pytest -q
      - name: Start Celery worker against Redis broker
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 12s .venv/bin/celery -A apps.api.workers.celery_app:celery_app worker --pool=solo --without-gossip --without-mingle --without-heartbeat --loglevel=INFO > /tmp/short-play-celery.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/short-play-celery.log
          if [[ "$STATUS" -ne 124 ]]; then
            echo "Celery worker exited unexpectedly with status $STATUS."
            exit 1
          fi
          grep -q "ready." /tmp/short-play-celery.log || {
            echo "Celery worker did not reach its ready state."
            exit 1
          }
          echo "Celery worker reached ready state and remained running until the smoke-test timeout."

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from the committed lock file
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  compose-validation:
    name: compose-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Build and start the private deployment stack
        run: docker compose up --build -d
      - name: Verify API health through Docker Compose
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/v1/health; then
              echo "API health endpoint responded."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api postgres redis
          echo "API did not become healthy."
          exit 1
      - name: Verify PostgreSQL and Redis readiness through the API
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent http://localhost:8000/api/v1/health/ready)"
          echo "$BODY"
          python3 -c 'import json,sys; payload=json.loads(sys.argv[1]); assert payload["status"]=="ok", payload; assert payload["components"]=={"postgresql":"ok","redis":"ok"}, payload' "$BODY"
      - name: Verify the Celery worker service is running
        run: |
          set -euo pipefail
          docker compose ps --status running --services | grep -qx worker
          echo "Celery worker container is running."
      - name: Verify the Celery beat recovery scheduler is running
        run: |
          set -euo pipefail
          docker compose ps --status running --services | grep -qx beat
          echo "Celery beat container is running."
      - name: Start and verify the frontend development service
        run: |
          set -euo pipefail
          docker compose --profile development up -d frontend
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/; then
              echo "Frontend development server responded."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color frontend
          echo "Frontend development server did not become ready."
          exit 1
      - name: Stop Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans
