name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: backend-quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: short_play
          POSTGRES_USER: short_play
          POSTGRES_PASSWORD: short_play
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U short_play -d short_play"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://short_play:short_play@localhost:5432/short_play
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python
        run: uv python install 3.12
      - name: Install backend dependencies from the committed lock file
        run: uv sync --locked --all-groups
      - name: Install FFmpeg and ffprobe for real media tests
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Ruff
        run: uv run ruff check .
      - name: Apply migrations to an empty PostgreSQL database
        run: uv run alembic upgrade head
      - name: Pytest
        run: |
          set -euo pipefail
          export STORAGE_ROOT="$RUNNER_TEMP/short-play-storage"
          mkdir -p "$STORAGE_ROOT"
          uv run pytest -q
      - name: Start Celery worker against Redis broker
        run: |
          set +e
          timeout --signal=TERM --kill-after=5s 12s .venv/bin/celery -A app.workers.celery_app:celery_app worker --pool=solo --without-gossip --without-mingle --without-heartbeat --loglevel=INFO > /tmp/short-play-celery.log 2>&1
          STATUS=$?
          set -e
          cat /tmp/short-play-celery.log
          if [[ "$STATUS" -ne 124 ]]; then
            echo "Celery worker exited unexpectedly with status $STATUS."
            exit 1
          fi
          grep -q "ready." /tmp/short-play-celery.log || {
            echo "Celery worker did not reach its ready state."
            exit 1
          }
          echo "Celery worker reached ready state and remained running until the smoke-test timeout."

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies from the committed lock file
        run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build

  compose-validation:
    name: compose-validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: short_play
      POSTGRES_USER: short_play
      POSTGRES_PASSWORD: short_play
      REDIS_PASSWORD: short-play-redis
      SECRET_KEY: ci-only-secret-key
      CELERY_BROKER_URL: redis://:short-play-redis@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:short-play-redis@redis:6379/1
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose files
        run: |
          docker compose -f docker/docker-compose.infra.yml config --quiet
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker/docker-compose.prod.yml config --quiet
      - name: Start shared infrastructure (PostgreSQL, Redis, RabbitMQ)
        run: docker compose -f docker/docker-compose.infra.yml up -d
      - name: Build and start the project stack
        run: docker compose up --build -d
      - name: Verify API health through Docker Compose
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8000/api/v1/health; then
              echo "API health endpoint responded."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api worker beat
          docker compose -f docker/docker-compose.infra.yml logs --no-color postgres redis
          echo "API did not become healthy."
          exit 1
      - name: Verify PostgreSQL and Redis readiness through the API
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if BODY="$(curl --fail --silent http://localhost:8000/api/v1/health/ready)"; then
              echo "$BODY"
              python3 -c 'import json,sys; payload=json.loads(sys.argv[1]); assert payload["status"]=="ok", payload; assert payload["components"]=={"postgresql":"ok","redis":"ok"}, payload' "$BODY"
              exit 0
            fi
            echo "readiness not settled yet (attempt $attempt)"
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api worker beat
          docker compose -f docker/docker-compose.infra.yml logs --no-color postgres redis
          echo "Readiness never reported postgresql and redis healthy."
          exit 1
      - name: Verify the Celery worker service is running
        run: |
          set -euo pipefail
          docker compose ps --status running --services | grep -qx worker
          echo "Celery worker container is running."
      - name: Verify the Celery beat recovery scheduler is running
        run: |
          set -euo pipefail
          docker compose ps --status running --services | grep -qx beat
          echo "Celery beat container is running."
      - name: Start and verify the web container
        run: |
          set -euo pipefail
          docker compose up -d web
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5173/; then
              echo "Web container responded."
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color web
          echo "Web container did not become ready."
          exit 1
      - name: Stop the project stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Stop the infrastructure stack
        if: always()
        run: docker compose -f docker/docker-compose.infra.yml down --volumes

  e2e-acceptance:
    name: e2e-acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start shared infrastructure (PostgreSQL, Redis, RabbitMQ)
        run: docker compose -f docker/docker-compose.infra.yml up -d
      - name: Build and start the project stack
        run: docker compose up --build -d
      - name: Wait for API readiness before the acceptance flow
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            BODY="$(curl --silent http://localhost:8000/api/v1/health/ready || true)"
            if python3 -c 'import json,sys; p=json.loads(sys.argv[1]); sys.exit(0 if p.get("status")=="ok" else 1)' "${BODY:-{\}}" 2>/dev/null; then
              echo "$BODY"
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api worker beat
          docker compose -f docker/docker-compose.infra.yml logs --no-color postgres redis
          echo "API readiness did not settle before the acceptance flow."
          exit 1
      - name: Run end-to-end acceptance against the running stack
        run: python3 scripts/e2e_acceptance.py --base-url http://localhost:8000 --timeout 300
      - name: Back up the deployment
        run: bash scripts/backup.sh docker/docker-compose.infra.yml docker-compose.yml
      - name: Verify the database dump restores into a fresh database
        run: |
          set -euo pipefail
          DB_ARCHIVE="$(ls -t backups/db-*.dump.gz | head -n 1)"
          test -s "$DB_ARCHIVE"
          docker compose -f docker/docker-compose.infra.yml exec -T postgres psql -U short_play -d postgres -c 'CREATE DATABASE short_play_restore'
          bash scripts/restore.sh "$DB_ARCHIVE" short_play_restore docker/docker-compose.infra.yml
      - name: Verify the restored database is queryable
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.infra.yml exec -T postgres psql -U short_play -d short_play_restore -Atc \
            'select count(*) from users' | tee /tmp/short-play-restored-users.txt
          grep -qx '[1-9][0-9]*' /tmp/short-play-restored-users.txt
      - name: Verify the media backup archive is non-empty
        run: |
          set -euo pipefail
          MEDIA_ARCHIVE="$(ls -t backups/media-*.tar.gz | head -n 1)"
          test -s "$MEDIA_ARCHIVE"
          tar -tzf "$MEDIA_ARCHIVE" | head -n 5
      - name: Stop the project stack
        if: always()
        run: docker compose down --volumes --remove-orphans
      - name: Stop the infrastructure stack
        if: always()
        run: docker compose -f docker/docker-compose.infra.yml down --volumes
