# Project services only: api / worker / beat / web.
# Base services (PostgreSQL / Redis / RabbitMQ) live in docker/docker-compose.infra.yml
# and are joined through the external network `short-play-infra`.
#
#   docker compose -f docker/docker-compose.infra.yml up -d
#   docker compose up --build -d

name: short-play-platform

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-short_play}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  CELERY_TIMEZONE: ${CELERY_TIMEZONE:-UTC}
  SECRET_KEY: ${SECRET_KEY:-replace-me-for-local-development}
  BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@localhost}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  BOOTSTRAP_ADMIN_FULL_NAME: ${BOOTSTRAP_ADMIN_FULL_NAME:-Platform Administrator}
  BOOTSTRAP_ORGANIZATION_NAME: ${BOOTSTRAP_ORGANIZATION_NAME:-Short Play Studio}
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173"]}
  STORAGE_ROOT: /data/storage
  MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-524288000}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: "1"
    ports:
      # Host port follows API_PORT; the container listens on its fixed 8000.
      - "${API_PORT:-8000}:8000"
    volumes:
      - media_storage:/data/storage
    networks:
      - default
      - infra
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    volumes:
      - media_storage:/data/storage
    networks:
      - default
      - infra
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *backend-env
    networks:
      - default
      - infra
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - default

volumes:
  media_storage:

networks:
  default:
  infra:
    external: true
    name: short-play-infra
