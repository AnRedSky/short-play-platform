services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-short_play}
      POSTGRES_USER: ${POSTGRES_USER:-short_play}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-short_play} -d ${POSTGRES_DB:-short_play}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-short_play}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "uv run --no-sync alembic upgrade head && uv run --no-sync uvicorn apps.api.main:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-short_play}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "celery", "-A", "apps.api.workers.celery_app:celery_app", "worker", "--loglevel=INFO"]

  beat:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-short_play}:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/${POSTGRES_DB:-short_play}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - apps.api.workers.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - -s
      - /tmp/celerybeat-schedule

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    ports:
      - "5173:5173"
    profiles: ["development"]

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
